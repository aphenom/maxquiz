<div style="position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ vid }}?rel=0&modestbranding=1&playsinline=1"
          title="{{ title }}" style="position:absolute;inset:0;width:100%;height:100%;border:0"
          allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
          allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<nav class="dash-burger-bar">
  <button type="button" class="chip orange dash-burger" id="dash-nav-toggle"
          aria-expanded="false" aria-controls="dash-nav-menu">
    {% if active == "overview" %}📊 Vue d'ensemble
    {% elif active == "categories" %}🗂️ {{ space.category_label_plural }}
    {% elif active == "quizzes" %}📝 Quiz
    {% elif active == "questions" %}❓ Questions
    {% elif active == "members" %}🪪 Membres
    {% elif active == "subscriptions" %}💳 Abonnements
    {% elif active == "shares" %}🤝 Reversements
    {% elif active == "team" %}👩‍🏫 Équipe
    {% elif active == "resources" %}📚 Ressources
    {% elif active == "pins" %}🔑 Codes PIN
    {% elif active == "reports" %}📨 Bilans parents
    {% elif active == "password" %}🔒 Mot de passe
    {% elif active == "journal" %}📜 Journal
    {% endif %} ▾
  </button>
  <div class="dash-nav-menu" id="dash-nav-menu">
    <a href="{% url 'space_dashboard' space.slug %}" class="chip {% if active == 'overview' %}orange{% endif %}">📊 Vue d'ensemble</a>
    <a href="{% url 'dashboard_categories' space.slug %}" class="chip {% if active == 'categories' %}orange{% endif %}">🗂️ {{ space.category_label_plural }}</a>
    <a href="{% url 'dashboard_quizzes' space.slug %}" class="chip {% if active == 'quizzes' %}orange{% endif %}">📝 Quiz</a>
    <a href="{% url 'dashboard_questions' space.slug %}" class="chip {% if active == 'questions' %}orange{% endif %}">❓ Questions</a>
    <a href="{% url 'dashboard_members' space.slug %}" class="chip {% if active == 'members' %}orange{% endif %}">🪪 Membres</a>
    <a href="{% url 'dashboard_team' space.slug %}" class="chip {% if active == 'team' %}orange{% endif %}">👩‍🏫 Équipe</a>
    <a href="{% url 'school_resources' space.slug %}" class="chip {% if active == 'resources' %}orange{% endif %}">📚 Ressources</a>
    <a href="{% url 'dashboard_pins' space.slug %}" class="chip {% if active == 'pins' %}orange{% endif %}">🔑 Codes PIN</a>
    <a href="{% url 'dashboard_reports' space.slug %}" class="chip {% if active == 'reports' %}orange{% endif %}">📨 Bilans parents</a>
    {% if space.subscription_required %}<a href="{% url 'dashboard_subscriptions' space.slug %}" class="chip {% if active == 'subscriptions' %}orange{% endif %}">💳 Abonnements</a>
    <a href="{% url 'dashboard_shares' space.slug %}" class="chip {% if active == 'shares' %}orange{% endif %}">🤝 Reversements</a>{% endif %}
    <a href="{% url 'dashboard_audit_log' space.slug %}" class="chip {% if active == 'journal' %}orange{% endif %}">📜 Journal</a>
    <a href="{% url 'dashboard_change_password' space.slug %}" class="chip {% if active == 'password' %}orange{% endif %}">🔒 Mot de passe</a>
    <a href="{% url 'dashboard_logout' space.slug %}" class="chip rouge">🚪 Déconnexion</a>
  </div>
</nav>
<script>
(function(){
  var btn = document.getElementById('dash-nav-toggle');
  var menu = document.getElementById('dash-nav-menu');
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', function(e){
    if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) {
      menu.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>

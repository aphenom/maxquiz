{# Recherche instantanée dans la page. Paramètres : scope (sélecteur CSS de la zone), placeholder. #}
<div class="mq-search">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input type="search" id="mqSearch" data-scope="{{ scope }}" value="{{ request.GET.q }}" placeholder="{{ placeholder }}"
         aria-label="{{ placeholder }}" autocomplete="off" enterkeyhint="search">
</div>
<p id="mqSearchEmpty" class="card small" style="margin-top:10px" hidden>Aucun résultat. Essaie un autre mot, par exemple le nom du chapitre.</p>
<style>
.mq-search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--sable);border-radius:14px;padding:0 12px;margin-top:12px;color:var(--brun)}
.mq-search:focus-within{border-color:var(--orange)}
.mq-search input{flex:1;border:none;outline:none;background:transparent;font-size:16px;padding:12px 0;min-width:0;color:var(--encre)}
.mq-hit{font-size:11px;font-weight:800;color:var(--vert);white-space:nowrap}
</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var input = document.getElementById('mqSearch'); if (!input) return;
  var scope = document.querySelector(input.dataset.scope); if (!scope) return;
  var empty = document.getElementById('mqSearchEmpty');
  var norm = function(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); };
  var items = Array.prototype.slice.call(scope.querySelectorAll('[data-search]'));
  var groups = Array.prototype.slice.call(scope.querySelectorAll('[data-group]'));
  var chaps = Array.prototype.slice.call(scope.querySelectorAll('[data-chap]'));
  var visible = function(el){ return Array.prototype.some.call(el.querySelectorAll('[data-search]'), function(i){ return !i.hidden; }); };
  var saved = null;
  function run(){
    var words = norm(input.value.trim()).split(/\s+/).filter(Boolean);
    if (!words.length) {
      items.forEach(function(i){ i.hidden = false; var h = i.querySelector('.mq-hit'); if (h) h.hidden = true; });
      chaps.forEach(function(c){ c.hidden = false; });
      groups.forEach(function(g){ g.hidden = false; if (saved && g.tagName === 'DETAILS') g.open = saved.get(g); });
      saved = null; empty.hidden = true; return;
    }
    if (!saved) { saved = new Map(); groups.forEach(function(g){ saved.set(g, g.open); }); }
    var n = 0;
    items.forEach(function(i){
      var title = i.dataset.title || '', all = i.dataset.search;
      var ok = words.every(function(w){ return all.indexOf(w) >= 0; });
      i.hidden = !ok; if (ok) n++;
      var h = i.querySelector('.mq-hit');
      if (h) h.hidden = !ok || words.every(function(w){ return title.indexOf(w) >= 0; });
    });
    chaps.forEach(function(c){ c.hidden = !visible(c); });
    groups.forEach(function(g){ var any = visible(g); g.hidden = !any; if (any && g.tagName === 'DETAILS') g.open = true; });
    empty.hidden = n > 0;
  }
  input.addEventListener('input', run);
  if (input.value) run();
});
</script>
